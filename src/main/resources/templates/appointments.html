<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Presidente — Agendamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* =============================================
   Barbearia Presidente — Appointments Page
   Coloque em: src/main/resources/static/css/appointments.css
   ============================================= */

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #1a1008;
            font-family: 'Lato', sans-serif;
        }

        /* ---------- Background ---------- */

        .bp-root {
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .bp-bg-lines {
            position: fixed;
            inset: 0;
            background-image:
                    repeating-linear-gradient(
                            0deg,
                            transparent,
                            transparent 38px,
                            rgba(212, 170, 90, 0.04) 38px,
                            rgba(212, 170, 90, 0.04) 39px
                    ),
                    repeating-linear-gradient(
                            90deg,
                            transparent,
                            transparent 38px,
                            rgba(212, 170, 90, 0.04) 38px,
                            rgba(212, 170, 90, 0.04) 39px
                    );
            pointer-events: none;
            z-index: 0;
        }

        /* ---------- Nav ---------- */

        .bp-nav {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(212, 170, 90, 0.2);
            background: rgba(18, 13, 5, 0.85);
            backdrop-filter: blur(6px);
        }

        .bp-nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bp-nav-ornament {
            color: #d4aa5a;
            font-size: 14px;
        }

        .bp-nav-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            color: #f0d98a;
            letter-spacing: 0.5px;
        }

        .bp-nav-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .bp-nav-username {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #d4aa5a;
            text-transform: uppercase;
        }

        .bp-nav-logout {
            background: transparent;
            border: 1px solid rgba(212, 170, 90, 0.35);
            color: #d4aa5a;
            font-family: 'Lato', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 1px;
            transition: background 0.2s, color 0.2s;
        }

        .bp-nav-logout:hover {
            background: rgba(212, 170, 90, 0.12);
            color: #f0d98a;
        }

        /* ---------- Main ---------- */

        .bp-main {
            position: relative;
            z-index: 1;
            max-width: 520px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
            animation: bp-fadein 0.5s ease both;
        }

        /* ---------- Header ---------- */

        .bp-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .bp-ornament {
            font-size: 16px;
            color: #d4aa5a;
            letter-spacing: 8px;
            margin-bottom: 0.75rem;
        }

        .bp-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 900;
            color: #f0d98a;
            letter-spacing: 1px;
        }

        .bp-desc {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 300;
            color: rgba(212, 170, 90, 0.6);
            letter-spacing: 1px;
        }

        /* ---------- Divider ---------- */

        .bp-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .bp-divider-line {
            flex: 1;
            height: 1px;
            background: rgba(212, 170, 90, 0.25);
        }

        .bp-divider-diamond {
            width: 6px;
            height: 6px;
            background: #d4aa5a;
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* ---------- Alert ---------- */

        .bp-alert {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 12px 16px;
            border-radius: 1px;
            margin-bottom: 1.5rem;
        }

        .bp-alert--success {
            background: rgba(212, 170, 90, 0.1);
            border: 1px solid rgba(212, 170, 90, 0.35);
            color: #d4aa5a;
        }

        /* ---------- Card ---------- */

        .bp-card {
            background: #120d05;
            border: 1px solid rgba(212, 170, 90, 0.3);
            border-radius: 2px;
            padding: 2.25rem 2rem;
            position: relative;
        }

        .bp-card::before,
        .bp-card::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: #d4aa5a;
            border-style: solid;
        }

        .bp-card::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }

        .bp-card::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }

        /* ---------- Form Fields ---------- */

        .bp-field {
            margin-bottom: 1.35rem;
        }

        .bp-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #d4aa5a;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .bp-input,
        .bp-select {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 170, 90, 0.25);
            border-radius: 1px;
            padding: 11px 14px;
            color: #f0e8d0;
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .bp-input:focus,
        .bp-select:focus {
            border-color: #d4aa5a;
            background: rgba(212, 170, 90, 0.05);
        }

        .bp-input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(70%) sepia(40%) saturate(400%) hue-rotate(5deg);
            cursor: pointer;
        }

        /* Select wrapper for custom arrow */
        .bp-select-wrapper {
            position: relative;
        }

        .bp-select-arrow {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4aa5a;
            font-size: 14px;
            pointer-events: none;
        }

        .bp-select option {
            background: #1a1008;
            color: #f0e8d0;
        }

        /* ---------- Button ---------- */

        .bp-btn {
            width: 100%;
            background: #d4aa5a;
            color: #120d05;
            border: none;
            padding: 14px;
            font-family: 'Lato', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 1px;
            margin-top: 0.75rem;
            transition: background 0.2s, transform 0.1s;
        }

        .bp-btn:hover {
            background: #e8c370;
        }

        .bp-btn:active {
            transform: scale(0.99);
        }

        .bp-alert--error {
            background: rgba(180, 40, 40, 0.1);
            border: 1px solid rgba(180, 40, 40, 0.35);
            color: #f08080;
        }
    </style>
</head>
<body>

<div class="bp-root">
    <div class="bp-bg-lines"></div>

    <!-- Nav -->
    <nav class="bp-nav">
        <div class="bp-nav-brand">
            <span class="bp-nav-ornament">✦</span>
            <span class="bp-nav-title">Barbearia Presidente</span>
        </div>
        <div class="bp-nav-user">
            <span class="bp-nav-username" sec:authentication="name">Usuário</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button class="bp-nav-logout" type="submit">Sair</button>
            </form>
        </div>
    </nav>

    <!-- Main -->
    <main class="bp-main">

        <!-- Header -->
        <div class="bp-header">
            <div class="bp-ornament">✦ ✦ ✦</div>
            <h1 class="bp-title">Agendar Horário</h1>
            <p class="bp-desc">Escolha seu barbeiro e horário preferido</p>
        </div>

        <div class="bp-divider">
            <div class="bp-divider-line"></div>
            <div class="bp-divider-diamond"></div>
            <div class="bp-divider-line"></div>
        </div>

        <!-- Success message -->
        <div th:if="${param.success}" class="bp-alert bp-alert--success">
            ✦ Agendamento realizado com sucesso!
        </div>

        <div th:if="${error}" class="bp-alert bp-alert--error">
            ✦ <span th:text="${error}"></span>
        </div>

        <!-- Form -->
        <div class="bp-card">
            <form th:action="@{/appointment}" th:object="${appointment}" method="post">

                <!-- Date -->
                <div class="bp-field">
                    <label class="bp-label" for="date">Data</label>
                    <input class="bp-input" type="date" id="date" name="date" required/>
                </div>


                <!-- Barber -->
                <div class="bp-field">
                    <label class="bp-label" for="barberName">Barbeiro</label>
                    <div class="bp-select-wrapper">
                        <select class="bp-select" id="barberName" th:field="*{barber}" required>
                            <option value="" disabled selected>Selecione um barbeiro</option>
                            <option th:each="barber : ${barbers}"
                                    th:value="${barber.id}"
                                    th:text="${barber.name}">
                            </option>
                        </select>
                        <span class="bp-select-arrow">▾</span>
                    </div>
                </div>

                <!-- Time -->
                <div class="bp-field">
                    <label class="bp-label" for="time">Horário</label>
                    <div class="bp-select-wrapper">
                        <select class="bp-select" id="time" name="time" required>
                            <option value="" disabled selected>Selecione um horário</option>
                            <option th:each="slot : ${timeSlots}"
                                    th:value="${slot}"
                                    th:text="${slot}">
                            </option>
                        </select>
                        <span class="bp-select-arrow">▾</span>
                    </div>
                </div>

                <div class="bp-field">
                    <label class="bp-label" for="service">Serviço</label>
                    <div class="bp-select-wrapper">
                        <select class="bp-select" id="service" th:field="*{service}" required>
                            <option value="" disabled selected>Selecione um serviço</option>
                            <option th:each="service : ${services}"
                                    th:value="${service}"
                                    th:text="${service.displayName} + '- R$ ' + ${service.price}">
                            </option>
                        </select>
                        <span class="bp-select-arrow">▾</span>
                    </div>
                </div>

                <button class="bp-btn" type="submit">Confirmar Agendamento</button>

            </form>
        </div>

    </main>
</div>

</body>
</html>
