<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #1a1008;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ---------- Background ---------- */

        .bp-root {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
            background: #1a1008;
        }

        .bp-bg-lines {
            position: absolute;
            inset: 0;
            background-image:
                    repeating-linear-gradient(
                            0deg,
                            transparent,
                            transparent 38px,
                            rgba(212, 170, 90, 0.04) 38px,
                            rgba(212, 170, 90, 0.04) 39px
                    ),
                    repeating-linear-gradient(
                            90deg,
                            transparent,
                            transparent 38px,
                            rgba(212, 170, 90, 0.04) 38px,
                            rgba(212, 170, 90, 0.04) 39px
                    );
            pointer-events: none;
        }

        /* ---------- Card ---------- */

        .bp-card {
            background: #120d05;
            border: 1px solid rgba(212, 170, 90, 0.35);
            border-radius: 2px;
            padding: 2.5rem 2.25rem 2rem;
            width: 100%;
            max-width: 400px;
            position: relative;
            animation: bp-fadein 0.5s ease both;
        }

        /* Corner accents */
        .bp-card::before,
        .bp-card::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: #d4aa5a;
            border-style: solid;
        }

        .bp-card::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }

        .bp-card::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }

        /* ---------- Logo / Header ---------- */

        .bp-logo {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .bp-ornament {
            font-size: 18px;
            color: #d4aa5a;
            letter-spacing: 8px;
            margin-bottom: 0.6rem;
        }

        .bp-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 900;
            color: #f0d98a;
            letter-spacing: 1px;
            line-height: 1.15;
        }

        .bp-subtitle {
            font-family: 'Lato', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #d4aa5a;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* ---------- Divider ---------- */

        .bp-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.75rem;
        }

        .bp-divider-line {
            flex: 1;
            height: 1px;
            background: rgba(212, 170, 90, 0.3);
        }

        .bp-divider-diamond {
            width: 6px;
            height: 6px;
            background: #d4aa5a;
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* ---------- Form ---------- */

        .bp-field {
            margin-bottom: 1.1rem;
        }

        .bp-label {
            display: block;
            font-family: 'Lato', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #d4aa5a;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .bp-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 170, 90, 0.25);
            border-radius: 1px;
            padding: 10px 12px;
            color: #f0e8d0;
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .bp-input:focus {
            border-color: #d4aa5a;
            background: rgba(212, 170, 90, 0.05);
        }

        .bp-input::placeholder {
            color: rgba(240, 232, 208, 0.25);
        }

        /* ---------- Button ---------- */

        .bp-btn {
            width: 100%;
            background: #d4aa5a;
            color: #120d05;
            border: none;
            padding: 13px;
            font-family: 'Lato', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 1px;
            margin-top: 0.5rem;
            transition: background 0.2s, transform 0.1s;
        }

        .bp-btn:hover {
            background: #e8c370;
        }

        .bp-btn:active {
            transform: scale(0.99);
        }

        /* ---------- Alerts ---------- */

        .bp-error {
            background: rgba(180, 40, 40, 0.15);
            border: 1px solid rgba(180, 40, 40, 0.4);
            color: #f08080;
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 1px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .bp-info {
            background: rgba(212, 170, 90, 0.1);
            border: 1px solid rgba(212, 170, 90, 0.3);
            color: #d4aa5a;
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 1px;
            margin-bottom: 1rem;
            text-align: center;
        }

        /* ---------- Footer ---------- */

        .bp-footer {
            text-align: center;
            margin-top: 1.25rem;
            font-family: 'Lato', sans-serif;
            font-size: 11px;
            color: rgba(212, 170, 90, 0.4);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div class="bp-root">
    <div class="bp-card">
        <div class="bp-logo">
            <div class="bp-scissors">✦ ✦ ✦</div>
            <h1 class="bp-title">Barbearia<br>Presidente</h1>
            <p class="bp-subtitle">Desde 1987</p>
        </div>

        <div class="bp-divider">...</div>

<form th:action="@{/login}" method="post"> <!-- ✅ action deve ser /login -->
    <!-- Exibe erro se login falhar -->
    <div th:if="${param.error}" class="bp-error">Usuário ou senha inválidos</div>

    <label for="username" class="bp-label">Usuário</label>
    <input type="text" name="username" id="username" placeholder="Usuário" class="bp-input"/> <!-- ✅ name="username" obrigatório -->

    <label for="password" class="bp-label">Senha</label>
    <input type="password" name="password" id="password" placeholder="Senha" class="bp-input"/> <!-- ✅ name="password" obrigatório -->

    <button type="submit" class="bp-btn">Entrar</button>

</form>
<form action="/register">
    <button type="submit" class="bp-btn">Registrar</button>
</form>
</body>
</html>
