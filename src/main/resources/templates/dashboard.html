<!-- templates/admin-dashboard.html -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Barbearia Presidente</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: "Georgia", serif;
            background:#1a0802;
            color:#d4a64f;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .dashboard-container{
            width:100%;
            max-width:1100px;
            border:1px solid rgba(212,166,79,0.5);
            background:#0b0502;
            padding:40px;
            position:relative;
        }

        .dashboard-container::before,
        .dashboard-container::after{
            content:"";
            position:absolute;
            width:18px;
            height:18px;
            border-color:#d4a64f;
        }

        .dashboard-container::before{
            top:-1px;
            left:-1px;
            border-top:3px solid #d4a64f;
            border-left:3px solid #d4a64f;
        }

        .dashboard-container::after{
            bottom:-1px;
            right:-1px;
            border-bottom:3px solid #d4a64f;
            border-right:3px solid #d4a64f;
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
            border-bottom:1px solid rgba(212,166,79,0.2);
            padding-bottom:20px;
        }

        .logo h1{
            font-size:42px;
            line-height:1.1;
            color:#f2c56b;
        }

        .logo p{
            margin-top:10px;
            letter-spacing:6px;
            font-size:12px;
        }

        .admin-info{
            text-align:right;
        }

        .admin-info h2{
            font-size:20px;
            margin-bottom:8px;
        }

        .content{
            display:grid;
            grid-template-columns: 350px 1fr;
            gap:40px;
        }

        .card{
            border:1px solid rgba(212,166,79,0.3);
            padding:25px;
            background:#120904;
        }

        .card-title{
            font-size:22px;
            margin-bottom:25px;
            color:#f2c56b;
            letter-spacing:2px;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-size:12px;
            letter-spacing:4px;
            text-transform:uppercase;
        }

        .form-group input{
            width:100%;
            padding:14px;
            background:#1c120b;
            border:1px solid rgba(212,166,79,0.2);
            color:#fff;
            outline:none;
            font-size:15px;
        }

        .form-group input:focus{
            border-color:#d4a64f;
        }

        .btn{
            width:100%;
            padding:14px;
            border:none;
            cursor:pointer;
            background:#d4a64f;
            color:#000;
            font-weight:bold;
            letter-spacing:4px;
            text-transform:uppercase;
            transition:0.3s;
        }

        .btn:hover{
            opacity:0.85;
        }

        .employee-list{
            display:flex;
            flex-direction:column;
            gap:16px;
        }

        .employee-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#1c120b;
            border:1px solid rgba(212,166,79,0.15);
            padding:18px;
        }

        .employee-data h3{
            color:#f2c56b;
            margin-bottom:5px;
        }

        .employee-data p{
            color:#c9b28b;
            font-size:14px;
        }

        .delete-btn{
            background:transparent;
            border:1px solid #d4a64f;
            color:#d4a64f;
            padding:10px 16px;
            cursor:pointer;
            letter-spacing:2px;
            transition:0.3s;
        }

        .delete-btn:hover{
            background:#d4a64f;
            color:#000;
        }

        @media(max-width:900px){
            .content{
                grid-template-columns:1fr;
            }

            .header{
                flex-direction:column;
                gap:20px;
                align-items:flex-start;
            }

            .admin-info{
                text-align:left;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">

    <div class="header">
        <div class="logo">
            <h1>Barbearia<br>Presidente</h1>
            <p>DESDE 1987</p>
        </div>

        <div class="admin-info">
            <h2>Painel Administrativo</h2>
            <span>Gerenciamento de Funcionários</span>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn">
                SAIR DA CONTA
            </button>
        </form>
    </div>

    <div class="content">

        <!-- FORM -->
        <div class="card">

            <h2 class="card-title">Adicionar Funcionário</h2>

            <form th:action="@{/admin/dashboard}" method="post">

                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" name="name" placeholder="Nome do funcionário" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="email@exemplo.com">
                </div>

                <button type="submit" class="btn">
                    Adicionar
                </button>

            </form>

        </div>

        <!-- EMPLOYEE LIST -->
        <div class="card">

            <h2 class="card-title">Funcionários</h2>

            <div class="employee-list">

                <div class="employee-item"
                     th:each="employee : ${employees}">

                    <div class="employee-data">
                        <h3 th:text="${employee.name}">Carlos Silva</h3>
                        <p th:text="${employee.email}">Barbeiro</p>
                    </div>

                    <form th:action="@{/admin/employees/delete/{id}(id=${employee.id})}"
                          method="post">

                        <button class="delete-btn" type="submit">
                            Remover
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
