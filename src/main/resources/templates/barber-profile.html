<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a0700;
            font-family: 'Inter', sans-serif;
            color: #d7aa52;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .profile-card {
            width: 500px;
            background: #090400;
            border: 1px solid rgba(215, 170, 82, 0.35);

            padding: 45px;

            position: relative;
        }

        .corner {
            width: 18px;
            height: 18px;
            position: absolute;
        }

        .top-left {
            top: -1px;
            left: -1px;
            border-top: 2px solid #d7aa52;
            border-left: 2px solid #d7aa52;
        }

        .bottom-right {
            right: -1px;
            bottom: -1px;
            border-right: 2px solid #d7aa52;
            border-bottom: 2px solid #d7aa52;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo span {
            display: block;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .logo h1 {
            font-family: 'Cinzel', serif;
            font-size: 42px;
            line-height: 1.1;
            font-weight: 700;
        }

        .logo p {
            margin-top: 14px;
            font-size: 12px;
            letter-spacing: 6px;
        }

        .profile-section,
        .appointments-section {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;

            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
        }

        .profile-name {
            background: #140b05;
            border: 1px solid rgba(215, 170, 82, 0.2);

            padding: 14px;
            font-size: 18px;
        }

        .appointment-card {
            background: #140b05;
            border: 1px solid rgba(215, 170, 82, 0.15);

            padding: 18px;
            margin-bottom: 14px;
        }

        .appointment-card h3 {
            margin-bottom: 10px;
            font-family: 'Cinzel', serif;
            font-size: 20px;
        }

        .appointment-card p {
            color: #e4d4b0;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .buttons {
            display: flex;
            gap: 14px;
            flex-direction: column;
            margin-top: 30px;
        }

        .gold-btn {
            background: #d7aa52;
            color: black;

            border: none;
            padding: 16px;

            font-weight: 700;
            letter-spacing: 4px;

            cursor: pointer;
            transition: 0.3s;
        }

        .gold-btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        .cancel-btn {
            background: transparent;
            border: 1px solid rgba(215, 170, 82, 0.4);
            color: #d7aa52;
            padding: 8px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }

        .cancel-btn:hover {
            background: rgba(215, 170, 82, 0.1);
        }
    </style>
</head>

<body>

<div class="page">

    <div class="profile-card">

        <div class="corner top-left"></div>
        <div class="corner bottom-right"></div>

        <div class="logo">
            <span>✦ ✦ ✦</span>

            <h1>
                Barbearia<br>
                Presidente
            </h1>

            <p>DESDE 1987</p>
        </div>

        <div class="profile-section">

            <label>Barbeiro</label>

            <div class="profile-name"
                 th:text="${username}">
            </div>

        </div>

        <div class="appointments-section">

            <label>AGENDAMENTOS</label>

            <!-- ✅ Mensagem quando não há agendamentos -->
            <div th:if="${#lists.isEmpty(appointments)}" class="appointment-card">
                <p style="text-align:center; letter-spacing: 2px;">Nenhum agendamento encontrado.</p>
            </div>

            <div class="appointment-card"
                 th:each="appointment : ${appointments}">

                <h3 th:text="${appointment.service.displayName}"></h3>

                <p>
                    <strong>Data:</strong>
                    <!--                    <span th:text="${appointment.dateTime}"></span>-->
                    <span th:text="${#temporals.format(appointment.dateTime, 'dd/MM/yyyy - HH:mm')}"></span>
                </p>

                <p>
                    <strong>Cliente:</strong>
                    <span th:text="${appointment.user.name}"></span>
                </p>

                <!-- ✅ Preço -->
                <p>
                    <strong>Preço:</strong>
                    <!--                    <span th:text="'R$ ' + ${appointment.price}"></span>-->
                    <span th:text="${appointment.formattedPrice}"></span>
                </p>

                <!-- ✅ Botão cancelar -->
<!--                <form th:action="@{/appointment/cancel/{id}(id=${appointment.id})}" method="post">-->
<!--                    <button type="submit" class="cancel-btn">CANCELAR</button>-->
<!--                </form>-->

            </div>



        </div>

        <div class="buttons">

<!--            <form action="/appointment">-->
<!--                <button class="gold-btn">-->
<!--                    FAZER AGENDAMENTO-->
<!--                </button>-->
<!--            </form>-->

<!--            <form action="/profile/edit">-->
<!--                <button class="gold-btn" >-->
<!--                    EDITAR CONTA-->
<!--                </button>-->
<!--            </form>-->

            <form th:action="@{/admin/dashboard}" method="ger">
                <button type="submit" class="gold-btn">
                    VOLTAR
                </button>
            </form>

        </div>


    </div>

</div>

</body>
</html>
